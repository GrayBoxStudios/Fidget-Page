<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PB Rocket Fidget Trainer</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
}

#hud {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 22px;
    z-index: 100;
}

.target {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    cursor: pointer;
}

.red {
    background: #ff4444;
}

.blue {
    background: #44aaff;
}

.hit {
    animation: pop 0.12s ease-out;
}

@keyframes pop {
    from { transform: scale(1.3); }
    to   { transform: scale(1); }
}
</style>
</head>
<body>

<div id="hud">
    Score: <span id="score">0</span><br>
    Streak: <span id="streak">0</span><br>
    Best: <span id="best">0</span>
</div>

<div id="target" class="target red"></div>

<script>

document.addEventListener("contextmenu", e => e.preventDefault());

let score = 0;
let streak = 0;
let best = 0;

let mouseX = window.innerWidth/2;
let mouseY = window.innerHeight/2;

let currentTargetType = "red";

let awaitingPB = false;
let pbReady = false;

let awaitingRocket = false;

const target = document.getElementById("target");

document.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function updateHUD() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    bestEl.textContent = best;
}

const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const bestEl = document.getElementById("best");

function breakStreak() {
    streak = 0;
    updateHUD();
}

function randomNearCursor() {

    const radius = 180;

    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * radius;

    let x = mouseX + Math.cos(angle) * dist;
    let y = mouseY + Math.sin(angle) * dist;

    x = Math.max(50, Math.min(window.innerWidth - 120, x));
    y = Math.max(50, Math.min(window.innerHeight - 120, y));

    target.style.left = x + "px";
    target.style.top = y + "px";
}

function spawnTarget() {

    currentTargetType =
        Math.random() > 0.5 ? "red" : "blue";

    target.className = "target " + currentTargetType;

    randomNearCursor();

    awaitingPB = false;
    pbReady = false;
    awaitingRocket = false;
}

function success() {

    score++;
    streak++;

    if(streak > best)
        best = streak;

    updateHUD();

    target.classList.add("hit");

    setTimeout(() => {
        target.classList.remove("hit");
    }, 100);

    spawnTarget();
}

document.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if(currentTargetType === "red") {

        if(key === "r") {
            awaitingPB = true;
            pbReady = false;
        }

    } else {

        if(key === "e") {
            awaitingRocket = true;
        }

    }
});

document.addEventListener("mousedown", e => {

    // RED TARGET (PB)

    if(currentTargetType === "red") {

        if(awaitingPB && e.button === 2) {
            pbReady = true;
            return;
        }

        if(pbReady && e.button === 0) {

            const rect = target.getBoundingClientRect();

            if(
                mouseX >= rect.left &&
                mouseX <= rect.right &&
                mouseY >= rect.top &&
                mouseY <= rect.bottom
            ) {
                success();
            } else {
                breakStreak();
            }

            awaitingPB = false;
            pbReady = false;

            return;
        }

        if(e.button === 0 || e.button === 2) {
            breakStreak();
        }
    }

    // BLUE TARGET (ROCKET)

    if(currentTargetType === "blue") {

        if(awaitingRocket && e.button === 0) {

            const rect = target.getBoundingClientRect();

            if(
                mouseX >= rect.left &&
                mouseX <= rect.right &&
                mouseY >= rect.top &&
                mouseY <= rect.bottom
            ) {
                success();
            } else {
                breakStreak();
            }

            awaitingRocket = false;

            return;
        }

        if(e.button === 0) {
            breakStreak();
        }
    }
});

spawnTarget();
updateHUD();

</script>
</body>
</html>
