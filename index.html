<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PB Rocket Trainer v2</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
    user-select:none;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    font-size:22px;
}

#weapon{
    position:fixed;
    top:15px;
    right:15px;
    font-size:26px;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

.target{
    position:absolute;
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    pointer-events:none;
    transform:scale(1);
}

.red{
    background:#ff3b3b;
    box-shadow:0 0 18px #ff3b3b;
}

.blue{
    background:#3aa8ff;
    box-shadow:0 0 18px #3aa8ff;
}

.pulse{
    animation:pulse 120ms ease-out;
}

@keyframes pulse{
    0%{transform:scale(1.6);}
    100%{transform:scale(1);}
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    pointer-events:none;
    border-radius:50%;
    opacity:1;
}

</style>
</head>

<body>

<div id="flash"></div>

<div id="hud">
Score: <span id="score">0</span><br>
Streak: <span id="streak">0</span><br>
Best: <span id="best">0</span>
</div>

<div id="weapon">PB</div>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

const flash=document.getElementById("flash");

let score=0;
let streak=0;
let best=parseInt(localStorage.getItem("best")||"0");

const scoreEl=document.getElementById("score");
const streakEl=document.getElementById("streak");
const bestEl=document.getElementById("best");
const weaponEl=document.getElementById("weapon");

let mouseX=innerWidth/2;
let mouseY=innerHeight/2;

let currentWeapon="pb";
let pbReady=false;

document.addEventListener("mousemove",e=>{
    mouseX=e.clientX;
    mouseY=e.clientY;
});

document.addEventListener("keydown",e=>{
    let k=e.key.toLowerCase();
    if(k==="r"){ currentWeapon="pb"; weaponEl.textContent="PB"; }
    if(k==="e"){ currentWeapon="rocket"; weaponEl.textContent="ROCKET"; }
});

function updateHUD(){
    scoreEl.textContent=score;
    streakEl.textContent=streak;
    bestEl.textContent=best;
}

function screenShake(p){
    document.body.animate([
        {transform:`translate(${p}px,0)`},
        {transform:`translate(${-p}px,0)`},
        {transform:`translate(0,0)`}
    ],{duration:60});
}

function flashScreen(){
    flash.animate([
        {opacity:0.35},
        {opacity:0}
    ],{duration:80});
}

/* ---------------- AUDIO (no files needed) ---------------- */
function playSound(type){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();

    o.connect(g);
    g.connect(ctx.destination);

    if(type==="hit"){
        o.frequency.value=180;
    } else {
        o.frequency.value=90;
    }

    g.gain.setValueAtTime(0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);

    o.start();
    o.stop(ctx.currentTime+0.08);
}

/* ---------------- PARTICLES ---------------- */

function spawnParticles(x,y,color){

    for(let i=0;i<18;i++){

        const p=document.createElement("div");
        p.className="particle";

        p.style.left=x+"px";
        p.style.top=y+"px";
        p.style.background=color;

        document.body.appendChild(p);

        let angle=Math.random()*Math.PI*2;
        let speed=2+Math.random()*4;

        let vx=Math.cos(angle)*speed;
        let vy=Math.sin(angle)*speed;

        let life=500+Math.random()*300;

        let start=performance.now();

        function anim(t){

            let dt=t-start;

            p.style.left=(x+vx*dt/10)+"px";
            p.style.top=(y+vy*dt/10)+"px";
            p.style.opacity=1-(dt/life);

            if(dt<life)
                requestAnimationFrame(anim);
            else
                p.remove();

        }

        requestAnimationFrame(anim);
    }
}

/* ---------------- TARGETS ---------------- */

let targets=[];

function createTarget(){

    const div=document.createElement("div");

    let type=Math.random()>0.5?"red":"blue";

    div.className="target "+type;
    div.textContent=type==="red"?"R":"E";

    document.body.appendChild(div);

    return{
        div,
        type,
        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight,
        angle:Math.random()*Math.PI*2,
        targetAngle:Math.random()*Math.PI*2,
        speed:1.2+Math.random()*1.8
    };
}

for(let i=0;i<5;i++)
    targets.push(createTarget());

/* ---------------- HIT ---------------- */

function hit(t){

    score++;
    streak++;

    if(streak>best){
        best=streak;
        localStorage.setItem("best",best);
    }

    updateHUD();

    screenShake(4+Math.min(streak*0.15,18));
    flashScreen();
    playSound("hit");

    spawnParticles(
        t.x,
        t.y,
        t.type==="red"?"#ff3b3b":"#3aa8ff"
    );

    t.div.classList.add("pulse");
    setTimeout(()=>t.div.classList.remove("pulse"),120);

    t.type=Math.random()>0.5?"red":"blue";
    t.div.className="target "+t.type;
    t.div.textContent=t.type==="red"?"R":"E";

    t.x=Math.random()*innerWidth;
    t.y=Math.random()*innerHeight;
}

/* ---------------- INPUT ---------------- */

document.addEventListener("mousedown",e=>{

    let hitSomething=false;

    for(let t of targets){

        let dx=mouseX-t.x;
        let dy=mouseY-t.y;
        let dist=Math.hypot(dx,dy);

        if(dist>32) continue;

        if(t.type==="red"){

            if(currentWeapon!=="pb"){
                streak=0; updateHUD();
                return;
            }

            if(e.button===2){
                pbReady=true;
                return;
            }

            if(e.button===0 && pbReady){
                hit(t);
                pbReady=false;
                hitSomething=true;
                break;
            }
        }

        if(t.type==="blue"){

            if(currentWeapon!=="rocket"){
                streak=0; updateHUD();
                return;
            }

            if(e.button===0){
                hit(t);
                hitSomething=true;
                break;
            }
        }
    }

    if(!hitSomething && e.button===0){
        streak=0;
        updateHUD();
        playSound("fail");
    }

});

/* ---------------- MOVEMENT ---------------- */

function angleLerp(a,b,t){
    let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;
    return a+d*t;
}

function update(){

    for(let t of targets){

        if(Math.random()<0.015)
            t.targetAngle=Math.random()*Math.PI*2;

        t.angle=angleLerp(t.angle,t.targetAngle,0.02);

        t.x+=Math.cos(t.angle)*t.speed;
        t.y+=Math.sin(t.angle)*t.speed;

        // HARD CLAMP (no escape)
        t.x=Math.max(32,Math.min(innerWidth-32,t.x));
        t.y=Math.max(32,Math.min(innerHeight-32,t.y));

        if(t.x<=32||t.x>=innerWidth-32)
            t.targetAngle=Math.PI-t.angle;

        if(t.y<=32||t.y>=innerHeight-32)
            t.targetAngle=-t.angle;

        t.div.style.left=(t.x-32)+"px";
        t.div.style.top=(t.y-32)+"px";

    }

    requestAnimationFrame(update);
}

updateHUD();
update();

</script>

</body>
</html>
