<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PB Rocket Layer Trainer</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#07070a;
    font-family:Arial;
    user-select:none;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    font-size:20px;
    z-index:1000;
}

#weapon{
    position:fixed;
    top:12px;
    right:12px;
    color:white;
    font-size:22px;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

.node{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:white;
    pointer-events:none;
    transition:filter 0.1s;
}

.red{ background:#ff3b3b; box-shadow:0 0 20px #ff3b3b; }
.blue{ background:#3aa8ff; box-shadow:0 0 20px #3aa8ff; }

.pulse{
    animation:pulse 90ms ease-out;
}

@keyframes pulse{
    0%{transform:scale(1.8);}
    100%{transform:scale(1);}
}

</style>
</head>

<body>

<div id="flash"></div>

<div id="hud">
Score: <span id="score">0</span><br>
Streak: <span id="streak">0</span><br>
Best: <span id="best">0</span>
</div>

<div id="weapon">PB</div>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

const flash=document.getElementById("flash");

let score=0;
let streak=0;
let best=parseInt(localStorage.getItem("best")||"0");

let mouseX=innerWidth/2;
let mouseY=innerHeight/2;

let weapon="pb";
let pbReady=false;

const scoreEl=document.getElementById("score");
const streakEl=document.getElementById("streak");
const bestEl=document.getElementById("best");
const weaponEl=document.getElementById("weapon");

function update(){
    scoreEl.textContent=score;
    streakEl.textContent=streak;
    bestEl.textContent=best;
}

document.addEventListener("mousemove",e=>{
    mouseX=e.clientX;
    mouseY=e.clientY;
});

document.addEventListener("keydown",e=>{
    let k=e.key.toLowerCase();
    if(k==="r"){ weapon="pb"; weaponEl.textContent="PB"; }
    if(k==="e"){ weapon="rocket"; weaponEl.textContent="ROCKET"; }
});

function shake(p){
    document.body.animate([
        {transform:`translate(${p}px,0)`},
        {transform:`translate(${-p}px,0)`},
        {transform:`translate(0,0)`}
    ],{duration:55});
}

function flash(){
    flash.animate([
        {opacity:0.4},
        {opacity:0}
    ],{duration:80});
}

function hitstop(){
    document.body.style.filter="brightness(2)";
    setTimeout(()=>document.body.style.filter="none",40);
}

function particles(x,y,color){
    for(let i=0;i<26;i++){
        const p=document.createElement("div");
        p.style.position="absolute";
        p.style.width="5px";
        p.style.height="5px";
        p.style.borderRadius="50%";
        p.style.background=color;
        p.style.left=x+"px";
        p.style.top=y+"px";
        document.body.appendChild(p);

        let a=Math.random()*Math.PI*2;
        let s=2+Math.random()*5;

        let vx=Math.cos(a)*s;
        let vy=Math.sin(a)*s;

        let life=500;

        let start=performance.now();

        function anim(t){
            let dt=t-start;

            p.style.left=(x+vx*dt/8)+"px";
            p.style.top=(y+vy*dt/8)+"px";
            p.style.opacity=1-dt/life;

            if(dt<life)
                requestAnimationFrame(anim);
            else
                p.remove();
        }

        requestAnimationFrame(anim);
    }
}

/* ---------------- LAYERS ---------------- */

class Node{

    constructor(){
        this.x=Math.random()*innerWidth;
        this.y=Math.random()*innerHeight;

        this.vx=0;
        this.vy=0;

        this.state="red"; // red → blue → dead

        this.el=document.createElement("div");
        this.el.className="node red";
        this.el.textContent="R";

        document.body.appendChild(this.el);
    }

    flee(){

        let dx=this.x-mouseX;
        let dy=this.y-mouseY;

        let dist=Math.hypot(dx,dy);

        if(dist<180){
            this.vx+=dx*0.02;
            this.vy+=dy*0.02;
        }

    }

    update(){

        this.flee();

        this.vx*=0.92;
        this.vy*=0.92;

        this.x+=this.vx;
        this.y+=this.vy;

        this.x=Math.max(30,Math.min(innerWidth-30,this.x));
        this.y=Math.max(30,Math.min(innerHeight-30,this.y));

        this.el.style.left=(this.x-30)+"px";
        this.el.style.top=(this.y-30)+"px";

    }

    render(){
        this.el.style.transform=
            `scale(${1+Math.sin(performance.now()/200)*0.03})`;
    }

    upgrade(){
        this.state="blue";
        this.el.className="node blue pulse";
        this.el.textContent="E";
    }

    destroy(){
        this.el.remove();
    }
}

/* ---------------- WORLD ---------------- */

let nodes=[];

for(let i=0;i<10;i++)
    nodes.push(new Node());

function spawnNode(){
    nodes.push(new Node());
}

/* ---------------- INPUT ---------------- */

document.addEventListener("mousedown",e=>{

    let hit=false;

    for(let n of nodes){

        let dx=mouseX-n.x;
        let dy=mouseY-n.y;
        let d=Math.hypot(dx,dy);

        if(d>34) continue;

        // RED PHASE
        if(n.state==="red"){

            if(weapon!=="pb"){
                streak=0; update(); return;
            }

            if(e.button===2){
                pbReady=true;
                return;
            }

            if(e.button===0 && pbReady){

                n.upgrade();

                pbReady=false;

                score++;
                streak++;

                hit=true;

                break;
            }
        }

        // BLUE PHASE
        else if(n.state==="blue"){

            if(weapon!=="rocket"){
                streak=0; update(); return;
            }

            if(e.button===0){

                n.destroy();
                nodes=nodes.filter(x=>x!==n);

                nodes.push(new Node());

                score++;
                streak++;

                hit=true;

                break;
            }
        }
    }

    if(hit){

        if(streak>best){
            best=streak;
            localStorage.setItem("best",best);
        }

        update();

        shake(6+Math.min(streak*0.1,18));
        flash();
        hitstop();

    } else if(e.button===0){

        streak=0;
        update();
    }

});

/* ---------------- LOOP ---------------- */

function loop(){

    for(let n of nodes){
        n.update();
        n.render();
    }

    requestAnimationFrame(loop);
}

update();
loop();

</script>

</body>
</html>
