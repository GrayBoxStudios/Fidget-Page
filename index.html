<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PB Rocket Trainer</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
    user-select:none;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    font-size:24px;
    text-shadow:0 0 10px white;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

.target{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    pointer-events:none;
}

.red{
    background:#ff4444;
    box-shadow:0 0 25px #ff4444;
}

.blue{
    background:#44aaff;
    box-shadow:0 0 25px #44aaff;
}

.floatText{
    position:absolute;
    color:white;
    font-weight:bold;
    pointer-events:none;
    text-shadow:0 0 10px white;
    z-index:999;
}

#weapon{
    position:fixed;
    top:15px;
    right:15px;
    font-size:28px;
}

#streakBig{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    opacity:0.15;
    font-weight:bold;
    pointer-events:none;
}

</style>
</head>
<body>

<div id="flash"></div>

<div id="hud">
Score: <span id="score">0</span><br>
Streak: <span id="streak">0</span><br>
Best: <span id="best">0</span>
</div>

<div id="weapon">PB</div>

<div id="streakBig">0</div>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

const flash=document.getElementById("flash");

const scoreEl=document.getElementById("score");
const streakEl=document.getElementById("streak");
const bestEl=document.getElementById("best");
const weaponEl=document.getElementById("weapon");
const streakBig=document.getElementById("streakBig");

let score=0;
let streak=0;
let best=parseInt(localStorage.getItem("best"))||0;

bestEl.textContent=best;

let mouseX=window.innerWidth/2;
let mouseY=window.innerHeight/2;

let currentWeapon="pb";

let pbReady=false;

document.addEventListener("mousemove",e=>{
    mouseX=e.clientX;
    mouseY=e.clientY;
});

document.addEventListener("keydown",e=>{

    let k=e.key.toLowerCase();

    if(k==="r"){
        currentWeapon="pb";
        weaponEl.textContent="PB";
    }

    if(k==="e"){
        currentWeapon="rocket";
        weaponEl.textContent="ROCKET";
    }

});

function updateHud(){

    scoreEl.textContent=score;
    streakEl.textContent=streak;
    bestEl.textContent=best;
    streakBig.textContent=streak;

}

function screenShake(power){

    document.body.animate([
        {transform:`translate(${power}px,0)`},
        {transform:`translate(${-power}px,0)`},
        {transform:`translate(0,0)`}
    ],{
        duration:60
    });

}

function flashScreen(){

    flash.animate([
        {opacity:0.25},
        {opacity:0}
    ],{
        duration:80
    });

}

function breakStreak(){

    streak=0;
    updateHud();

}

function floatingText(x,y,text){

    let el=document.createElement("div");

    el.className="floatText";
    el.textContent=text;

    el.style.left=x+"px";
    el.style.top=y+"px";

    document.body.appendChild(el);

    el.animate([
        {
            transform:"translateY(0px)",
            opacity:1
        },
        {
            transform:"translateY(-40px)",
            opacity:0
        }
    ],{
        duration:500
    });

    setTimeout(()=>el.remove(),500);

}

function angleLerp(current,target,t){

    let diff=
    ((target-current+Math.PI*3)
    %(Math.PI*2))
    -Math.PI;

    return current+diff*t;

}

let targets=[];

function createTarget(){

    let div=document.createElement("div");

    let type=Math.random()>0.5?"red":"blue";

    div.className="target "+type;

    document.body.appendChild(div);

    return {

        div,

        type,

        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,

        angle:Math.random()*Math.PI*2,
        targetAngle:Math.random()*Math.PI*2,

        speed:1.5+Math.random()*1.5

    };

}

for(let i=0;i<5;i++)
    targets.push(createTarget());

function hitTarget(target){

    score++;
    streak++;

    if(streak>best){

        best=streak;
        localStorage.setItem("best",best);

    }

    updateHud();

    flashScreen();

    screenShake(
        Math.min(
            5+(streak*0.15),
            20
        )
    );

    floatingText(
        target.x,
        target.y,
        "+"+streak
    );

    target.type=Math.random()>0.5?"red":"blue";

    target.div.className=
        "target "+target.type;

    target.x=Math.random()*window.innerWidth;
    target.y=Math.random()*window.innerHeight;

}

document.addEventListener("mousedown",e=>{

    let hit=false;

    for(let target of targets){

        let dx=mouseX-target.x;
        let dy=mouseY-target.y;

        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist>35)
            continue;

        if(target.type==="red"){

            if(currentWeapon!=="pb"){
                breakStreak();
                return;
            }

            if(e.button===2){

                pbReady=true;
                return;

            }

            if(e.button===0 && pbReady){

                hit=true;
                pbReady=false;

                hitTarget(target);

                break;

            }

        }

        if(target.type==="blue"){

            if(currentWeapon!=="rocket"){
                breakStreak();
                return;
            }

            if(e.button===0){

                hit=true;

                hitTarget(target);

                break;

            }

        }

    }

    if(!hit && e.button===0)
        breakStreak();

});

function update(){

    for(let t of targets){

        if(Math.random()<0.01){

            t.targetAngle=
                Math.random()*Math.PI*2;

        }

        t.angle=
            angleLerp(
                t.angle,
                t.targetAngle,
                0.02
            );

        t.x+=Math.cos(t.angle)*t.speed;
        t.y+=Math.sin(t.angle)*t.speed;

        if(t.x<30||t.x>window.innerWidth-30)
            t.targetAngle=Math.PI-t.angle;

        if(t.y<30||t.y>window.innerHeight-30)
            t.targetAngle=-t.angle;

        t.div.style.left=(t.x-30)+"px";
        t.div.style.top=(t.y-30)+"px";

        let scale=
            1+
            Math.sin(
                performance.now()/150
            )*0.05;

        t.div.style.transform=
            `scale(${scale})`;

    }

    requestAnimationFrame(update);

}

updateHud();
update();

</script>

</body>
</html>
